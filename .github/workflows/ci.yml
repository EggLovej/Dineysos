name: CI

on:
  push:
    branches: [main, quick_update]
  pull_request:

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  # The production build is covered by Vercel's preview deployment on every push,
  # which reports its own status check, so it is not repeated here.
